            <stop offset="0.6" stop-color="#FED7AA" stop-opacity="0.6" />
            <stop offset="1" stop-color="#FDBA74" stop-opacity="0.45" />
        </linearGradient>
        <linearGradient id="paint2_orange" x1="81.3163" y1="457.376" x2="817.514" y2="352.906" gradientUnits="userSpaceOnUse">
